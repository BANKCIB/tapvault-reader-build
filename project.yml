name: TapVault
options:
  bundleIdPrefix: com.m7madv
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
packages:
  CardCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
targets:
  TapVault:
    type: application
    platform: iOS
    sources:
      - path: TapVault
    settings:
      base:
        INFOPLIST_FILE: TapVault/Info.plist
        CODE_SIGN_ENTITLEMENTS: TapVault/TapVault.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": TapVault/Simulator.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.m7madv.tapvault
        MARKETING_VERSION: "1.3.0"
        CURRENT_PROJECT_VERSION: "8"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: CardCore
  TapVaultUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TapVaultUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: TapVault
      - package: CardCore
schemes:
  TapVault:
    build:
      targets:
        TapVault: all
    test:
      targets: [TapVaultUITests]
