name: iPhone build and checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iphone-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
          python3 scripts/verify-build-config.py
          git diff --exit-code -- TapVault/Info.plist TapVault/TapVault.entitlements
          mkdir -p build
          xcodebuild -version | tee build/toolchain.txt
          xcodegen version | tee -a build/toolchain.txt
      - name: Test data validation and backup cryptography
        run: |
          set -o pipefail
          swift test --package-path Core 2>&1 | tee build/core-tests.log
      - name: Build iPhone archive without signing
        run: |
          set -o pipefail
          xcodebuild archive -project TapVault.xcodeproj -scheme TapVault -configuration Release -destination 'generic/platform=iOS' -archivePath build/TapVault.xcarchive CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/archive.log
          python3 scripts/verify-build-config.py build/TapVault.xcarchive/Products/Applications/TapVault.app
          mkdir -p build/unsigned/Payload
          ditto build/TapVault.xcarchive/Products/Applications/TapVault.app build/unsigned/Payload/TapVault.app
          cd build/unsigned
          zip -qr ../TapVault-UNSIGNED.ipa Payload
      - name: Run interface checks on iPhone Simulator
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); phones=[x for a in d["devices"].values() for x in a if "iPhone" in x["name"]]; phones.sort(key=lambda x: ("iPhone 16" not in x["name"], x["name"])); print(phones[0]["udid"])')
          echo "$DEVICE_ID" > build/simulator-id.txt
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcodebuild test -project TapVault.xcodeproj -scheme TapVault -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" -parallel-testing-enabled NO -resultBundlePath build/UITests.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/ui-tests.log
      - name: Export UI screenshots
        if: always()
        run: |
          if [ -d build/UITests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/UITests.xcresult --output-path build/screenshots
          fi
      - name: Save build outputs and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TapVault-iphone-build
          retention-days: 14
          path: |
            build/TapVault-UNSIGNED.ipa
            build/*.log
            build/toolchain.txt
            build/screenshots
            TapVault.xcodeproj
            TapVault/TapVault.entitlements
