name: iPhone build and checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iphone-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
          python3 scripts/verify-build-config.py
          git diff --exit-code -- TapVault/Info.plist TapVault/TapVault.entitlements
          mkdir -p build
          xcodebuild -version | tee build/toolchain.txt
          xcrun --sdk iphoneos --show-sdk-version | tee -a build/toolchain.txt
          xcodegen version | tee -a build/toolchain.txt
      - name: Test data validation and backup cryptography
        run: |
          set -o pipefail
          swift test --package-path Core 2>&1 | tee build/core-tests.log
      - name: Build iPhone archive without signing
        run: |
          set -o pipefail
          xcodebuild archive -project TapVault.xcodeproj -scheme TapVault -configuration Release -destination 'generic/platform=iOS' -archivePath build/TapVault.xcarchive CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/archive.log
          python3 scripts/verify-build-config.py build/TapVault.xcarchive/Products/Applications/TapVault.app
          mkdir -p build/unsigned/Payload
          ditto build/TapVault.xcarchive/Products/Applications/TapVault.app build/unsigned/Payload/TapVault.app
          cd build/unsigned
          zip -qr ../TapVault-UNSIGNED.ipa Payload
      - name: Run interface checks on iPhone Simulator
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); phones=[x for runtime,a in d["devices"].items() if "iOS-26-2" in runtime for x in a if x["name"]=="iPhone 17 Pro Max"]; assert phones, "Required App Store screenshot simulator unavailable"; print(phones[0]["udid"])')
          echo "$DEVICE_ID" > build/simulator-id.txt
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl status_bar "$DEVICE_ID" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          # Simulator Keychain access requires a signed application identity.
          # This ad-hoc signature is only for the simulator; no private credentials are used.
          xcodebuild build-for-testing -project TapVault.xcodeproj -scheme TapVault -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath build/Simulator CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- 2>&1 | tee build/ui-build.log
          codesign --verify --strict build/Simulator/Build/Products/Debug-iphonesimulator/TapVault.app
          # Xcode embeds simulator entitlements in __TEXT,__entitlements, separately from the host signature.
          cp build/Simulator/Build/Intermediates.noindex/TapVault.build/Debug-iphonesimulator/TapVault.build/TapVault.app-Simulated.xcent build/simulator-entitlements.plist
          /usr/libexec/PlistBuddy -c 'Print :application-identifier' build/simulator-entitlements.plist
          xcodebuild test-without-building -project TapVault.xcodeproj -scheme TapVault -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath build/Simulator -parallel-testing-enabled NO -resultBundlePath build/UITests.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- 2>&1 | tee build/ui-tests.log
      - name: Export UI screenshots
        if: always()
        run: |
          if [ -d build/UITests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/UITests.xcresult --output-path build/screenshots
          fi
      - name: Save build outputs and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TapVault-iphone-build
          retention-days: 14
          path: |
            build/TapVault-UNSIGNED.ipa
            build/*.log
            build/toolchain.txt
            build/screenshots
            TapVault.xcodeproj
            TapVault/TapVault.entitlements
